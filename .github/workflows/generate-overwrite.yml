name: Generate and validate overrides

on:
  push:
    branches: [main]
    paths:
      - 'Overwrite/source/**'
      - 'Overwrite/scripts/**'
      - 'Overwrite/tests/**'
      - 'Overwrite/compatibility/**'
      - 'Overwrite/requirements.txt'
      - '.github/workflows/generate-overwrite.yml'
  pull_request:
    paths:
      - 'Overwrite/source/**'
      - 'Overwrite/scripts/**'
      - 'Overwrite/tests/**'
      - 'Overwrite/compatibility/**'
      - 'Overwrite/requirements.txt'
      - '.github/workflows/generate-overwrite.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overwrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install YAML parser
        run: python -m pip install -r Overwrite/requirements.txt
      - name: Check latest official versions and normative sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python Overwrite/scripts/check_upstream.py
      - name: Test additions, deletions and invalid inputs
        run: python -m unittest discover -s Overwrite/tests -v
      - name: Generate four fixed-name candidates
        run: python Overwrite/scripts/generate.py
      - name: Verify live rule sets with official Mihomo parser
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python Overwrite/scripts/verify_core.py
      - name: Check native client acceptance before publishing
        id: gate
        shell: bash
        run: |
          if python Overwrite/scripts/check_upstream.py --publication-check > .build/publication-status.txt; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              cat .build/publication-status.txt
              exit "$status"
            fi
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
          cat .build/publication-status.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Store candidates and validation reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: override-candidates
          path: |
            .build/Overwrite/
            .build/*report.json
            .build/publication-status.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: validate
    if: needs.validate.outputs.ready == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: override-candidates
          path: .build
      - name: Recheck before publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r Overwrite/requirements.txt
          python Overwrite/scripts/check_upstream.py
          python Overwrite/scripts/check_upstream.py --publication-check
          python Overwrite/scripts/publish.py
